name: Release the generic plugin zip

# Push a tag like v0.2.1: this builds bridgr-plugin-<version>.zip (no company address; it asks on install) and
# attaches it to that tag's GitHub Release, for Claude Desktop's Upload plugin. Company zips are never built here:
# each company's own Bridgr hands out its own (Settings → Connected assistants).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the plugin's version
        run: |
          v=$(python3 -c "import json; print(json.load(open('plugins/bridgr/.claude-plugin/plugin.json'))['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but plugin.json says $v"; exit 1; }
      - name: Build
        run: python3 tools/build_zip.py --out dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Bridgr plugin $GITHUB_REF_NAME" --notes "Upload in Claude Desktop: Settings → Customize → Plugins → Add → Upload plugin. It asks for your company's Bridgr address. If your company's Bridgr offers its own zip (Settings → Connected assistants), use that one instead."
